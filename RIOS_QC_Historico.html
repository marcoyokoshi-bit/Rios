<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RIOS — Histórico QC Visual</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --dk:#050510;--dk2:#0a0a1e;--sf:#101028;
  --bl:#2b8fff;--cy:#00d4ff;--or:#ff8c00;--rd:#ff4d6a;
  --gn:#27d97e;--yl:#ffd93d;--tx:#e8eaf0;--sb:#7a8ca0;
}
html,body{height:100%;width:100%;background:var(--dk);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;overflow:hidden;}
#neuralBg{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* ── Topbar ── */
.topbar{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;
  background:rgba(5,5,16,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.06);
  display:flex;align-items:center;gap:10px;padding:0 16px;}
.back-btn{background:none;border:none;color:rgba(255,255,255,.45);
  font-size:24px;cursor:pointer;padding:2px 6px;line-height:1;transition:.15s;}
.back-btn:hover{color:var(--bl);}
.topbar-title{font-size:13px;font-weight:700;color:var(--tx);flex:1;}
.cortex-dot{width:8px;height:8px;border-radius:50%;background:var(--sb);}

/* ── Content ── */
.content{position:fixed;inset:52px 0 0 0;overflow-y:auto;overflow-x:hidden;
  padding:16px 16px 40px;z-index:10;}
.content::-webkit-scrollbar{width:3px;}
.content::-webkit-scrollbar-thumb{background:rgba(43,143,255,.25);border-radius:3px;}

/* ── Section label ── */
.slbl{font-size:10px;font-weight:700;color:var(--sb);letter-spacing:2px;
  text-transform:uppercase;margin:0 0 10px;}

/* ── Stats ── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px;}
.stat-box{background:var(--dk2);border-radius:12px;border:1px solid rgba(255,255,255,.06);
  padding:12px 6px;text-align:center;}
.stat-num{font-size:20px;font-weight:900;line-height:1.1;}
.stat-lbl{font-size:8.5px;color:var(--sb);text-transform:uppercase;letter-spacing:.5px;margin-top:4px;}

/* ── Trend bar (última semana) ── */
.trend-wrap{background:var(--dk2);border-radius:12px;border:1px solid rgba(255,255,255,.06);
  padding:14px 16px;margin-bottom:20px;}
.trend-title{font-size:11px;font-weight:700;color:var(--sb);margin-bottom:10px;}
.trend-bars{display:flex;align-items:flex-end;gap:5px;height:48px;}
.trend-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.trend-bar{width:100%;border-radius:3px 3px 0 0;min-height:3px;transition:.4s;}
.trend-day{font-size:8px;color:var(--sb);}
.trend-pct{font-size:8px;font-weight:700;}

/* ── Period filter ── */
.filter-row{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;}
.filter-row::-webkit-scrollbar{display:none;}
.filt-btn{flex-shrink:0;padding:7px 16px;border-radius:20px;
  background:var(--dk2);border:1px solid rgba(255,255,255,.08);
  color:var(--sb);font-size:11px;font-weight:600;cursor:pointer;transition:.15s;}
.filt-btn.active{background:rgba(43,143,255,.15);border-color:var(--bl);color:var(--bl);}

/* ── Tabs (3 abas) ── */
.tabs{display:flex;gap:0;margin-bottom:14px;
  background:var(--dk2);border-radius:10px;border:1px solid rgba(255,255,255,.07);padding:4px;}
.tab{flex:1;padding:7px 2px;text-align:center;border-radius:7px;
  font-size:10px;font-weight:700;cursor:pointer;transition:.15s;color:var(--sb);}
.tab.active-ok   {background:rgba(39,217,126,.18);color:var(--gn);}
.tab.active-err  {background:rgba(255,77,106,.18);color:var(--rd);}
.tab.active-warn {background:rgba(255,140,0,.18);color:var(--or);}

/* ── Lista compacta ── */
.gallery{display:flex;flex-direction:column;gap:8px;}
.photo-card{background:var(--dk2);border-radius:12px;border:1px solid rgba(255,255,255,.06);
  display:flex;align-items:center;gap:12px;padding:10px 12px;
  transition:.15s;cursor:pointer;overflow:hidden;}
.photo-card:hover{border-color:rgba(43,143,255,.3);background:rgba(43,143,255,.04);
  transform:translateX(3px);}
.photo-card:active{transform:scale(.98);}

/* Thumb pequena (64×64) */
.card-thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;
  display:block;background:var(--sf);flex-shrink:0;}
.card-no-photo{width:64px;height:64px;display:flex;align-items:center;
  justify-content:center;background:var(--sf);font-size:22px;color:var(--sb);
  border-radius:8px;flex-shrink:0;}

/* Info ao lado da thumb */
.card-body{flex:1;min-width:0;}
.card-pct{font-size:17px;font-weight:900;line-height:1;float:right;margin-left:8px;}
.card-name{font-size:12px;font-weight:700;color:var(--tx);margin:0 0 3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-meta{font-size:9px;color:var(--sb);line-height:1.6;}
.card-status{display:inline-block;border-radius:10px;padding:1px 8px;
  font-size:8px;font-weight:700;margin-top:3px;}
.card-status.ok  {background:rgba(39,217,126,.12);color:var(--gn);}
.card-status.err {background:rgba(255,77,106,.12);color:var(--rd);}
.card-status.warn{background:rgba(255,140,0,.12);color:var(--or);}
.card-miss{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;}
.miss-tag{background:rgba(255,77,106,.12);border-radius:10px;
  padding:1px 6px;font-size:8px;color:var(--rd);font-weight:600;}

/* ── Empty state ── */
.empty{text-align:center;padding:48px 20px;color:var(--sb);grid-column:1/-1;}
.empty-icon{font-size:44px;display:block;margin-bottom:12px;}
.empty-msg{font-size:12px;line-height:1.6;}

/* ── Lightbox ── */
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.95);
  display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
.modal-bg.show{display:flex;}
.modal-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.1);
  border:none;border-radius:50%;width:36px;height:36px;color:#fff;font-size:20px;
  cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;}
.modal-imgs{display:flex;gap:8px;max-width:100%;}
.modal-img{flex:1;max-width:50%;max-height:48vh;border-radius:10px;object-fit:contain;}
.modal-cap{font-size:9px;color:var(--sb);text-align:center;margin-top:4px;}
.modal-info{margin-top:14px;text-align:center;max-width:380px;width:100%;}
.modal-name{font-size:15px;font-weight:800;margin-bottom:6px;}
.modal-pct{font-size:24px;font-weight:900;margin-bottom:4px;}
.modal-detail{font-size:11px;color:var(--sb);line-height:1.7;}
.modal-miss{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:8px;}
.modal-miss-tag{background:rgba(255,77,106,.12);border-radius:10px;
  padding:3px 10px;font-size:10px;color:var(--rd);font-weight:600;}
.modal-nav{display:flex;gap:12px;margin-top:14px;}
.modal-nav-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);
  border-radius:8px;color:#fff;padding:8px 18px;font-size:12px;cursor:pointer;transition:.15s;}
.modal-nav-btn:hover{background:rgba(43,143,255,.2);border-color:var(--bl);}
.modal-nav-btn:disabled{opacity:.3;cursor:not-allowed;}
</style>
</head>
<body>
<canvas id="neuralBg"></canvas>

<!-- ── Topbar ── -->
<div class="topbar">
  <button class="back-btn" onclick="goBack()">‹</button>
  <div class="topbar-title">📊 Histórico QC Visual</div>
  <div class="cortex-dot" id="cortex-dot"></div>
</div>

<!-- ── Content ── -->
<div class="content">

  <!-- Stats -->
  <div class="slbl">Desempenho</div>
  <div class="stats-row" style="grid-template-columns:repeat(4,1fr)">
    <div class="stat-box">
      <div class="stat-num" id="st-total">0</div>
      <div class="stat-lbl">Total</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" style="color:var(--gn)" id="st-aprov">0</div>
      <div class="stat-lbl">Aprovados</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" style="color:var(--rd)" id="st-reprov">0</div>
      <div class="stat-lbl">Refeitos</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" style="color:var(--or)" id="st-falha">0</div>
      <div class="stat-lbl">C/ Falha</div>
    </div>
  </div>

  <!-- Trend (últimos 7 dias) -->
  <div class="slbl">Últimos 7 Dias</div>
  <div class="trend-wrap">
    <div class="trend-title" id="trend-title">Taxa de aprovação por dia</div>
    <div class="trend-bars" id="trend-bars"></div>
  </div>

  <!-- Filter -->
  <div class="filter-row">
    <button class="filt-btn active" onclick="setFilter('hoje',this)">Hoje</button>
    <button class="filt-btn" onclick="setFilter('semana',this)">Esta semana</button>
    <button class="filt-btn" onclick="setFilter('mes',this)">Este mês</button>
    <button class="filt-btn" onclick="setFilter('tudo',this)">Tudo</button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active-ok"  id="tab-ok"   onclick="setTab('ok',this)">✅ Aprovados</div>
    <div class="tab"            id="tab-err"  onclick="setTab('err',this)">🔄 Refeitos</div>
    <div class="tab"            id="tab-warn" onclick="setTab('warn',this)">⚠️ C/ Falha</div>
  </div>

  <!-- Gallery -->
  <div class="gallery" id="gallery"></div>

</div>

<!-- ── Lightbox ── -->
<div class="modal-bg" id="modal">
  <button class="modal-close" onclick="closeModal()">✕</button>

  <div class="modal-imgs" id="modal-imgs"></div>

  <div class="modal-info">
    <div class="modal-pct" id="modal-pct"></div>
    <div class="modal-name" id="modal-name"></div>
    <div class="modal-detail" id="modal-detail"></div>
    <div class="modal-miss" id="modal-miss"></div>
  </div>

  <div class="modal-nav">
    <button class="modal-nav-btn" id="btn-prev" onclick="navModal(-1)">← Anterior</button>
    <button class="modal-nav-btn" id="btn-next" onclick="navModal(+1)">Próximo →</button>
  </div>
</div>

<script>
// ── Estado ────────────────────────────────────────────────────────────────────
let currentFilter = 'hoje';
let currentTab    = 'ok';
let filteredItems = [];
let modalIdx      = 0;

function goBack() { window.location.href = '/qc'; }

// ── Dados ─────────────────────────────────────────────────────────────────────
function getHistory() {
  try { return JSON.parse(localStorage.getItem('rios_qc_history') || '[]'); }
  catch(e) { return []; }
}

function filterByPeriod(list) {
  const now  = new Date();
  const hoje = new Date(now); hoje.setHours(0,0,0,0);
  const semana = new Date(now - 6 * 86400000); semana.setHours(0,0,0,0);
  const mes  = new Date(now.getFullYear(), now.getMonth(), 1);
  return list.filter(r => {
    const d = new Date(r.ts);
    if (currentFilter === 'hoje')   return d >= hoje;
    if (currentFilter === 'semana') return d >= semana;
    if (currentFilter === 'mes')    return d >= mes;
    return true;
  });
}

// ── Controles ─────────────────────────────────────────────────────────────────
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filt-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

// ── Trend dos últimos 7 dias ──────────────────────────────────────────────────
function renderTrend() {
  const all  = getHistory();
  const now  = new Date();
  const bars = document.getElementById('trend-bars');
  const dias = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  let cols   = '';

  for (let i = 6; i >= 0; i--) {
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    const str = d.toDateString();
    const dia = dias[d.getDay()];
    const deHoje = all.filter(r => new Date(r.ts).toDateString() === str);
    const total  = deHoje.length;
    const aprov  = deHoje.filter(r => r.pct >= 80).length;
    const taxa   = total ? Math.round(aprov / total * 100) : null;
    const h      = taxa !== null ? Math.max(taxa * 0.46, 3) : 3;
    const cor    = taxa === null ? 'rgba(255,255,255,.08)'
                 : taxa >= 80   ? 'rgba(39,217,126,.7)'
                 : taxa >= 50   ? 'rgba(255,140,0,.7)'
                 :               'rgba(255,77,106,.7)';
    const lbl = taxa !== null ? taxa + '%' : '—';
    cols += `
      <div class="trend-col">
        <div class="trend-pct" style="color:${taxa===null?'var(--sb)':taxa>=80?'var(--gn)':taxa>=50?'var(--or)':'var(--rd)'}">${lbl}</div>
        <div class="trend-bar" style="height:${h}px;background:${cor}" title="${deHoje.length} registros"></div>
        <div class="trend-day">${i === 0 ? 'Hoje' : dia}</div>
      </div>`;
  }
  bars.innerHTML = cols;
}

// ── Helpers de status ─────────────────────────────────────────────────────────
function getStatus(r) {
  // Compatibilidade com registros antigos (sem campo status)
  if (r.status) return r.status;
  return (r.pct || 0) >= 80 ? 'aprovado' : 'refazer';
}

// ── setTab atualizado para 3 abas ─────────────────────────────────────────────
function setTab(t, btn) {
  currentTab = t;
  document.querySelectorAll('.tab').forEach(b => {
    b.classList.remove('active-ok','active-err','active-warn');
  });
  const cls = t === 'ok' ? 'active-ok' : t === 'err' ? 'active-err' : 'active-warn';
  btn.classList.add(cls);
  render();
}

// ── Render principal ──────────────────────────────────────────────────────────
function render() {
  const all        = filterByPeriod(getHistory());
  const aprovados  = all.filter(r => getStatus(r) === 'aprovado');
  const refeitos   = all.filter(r => getStatus(r) === 'refazer');
  const falhas     = all.filter(r => getStatus(r) === 'aceito_falha');

  // Stats
  document.getElementById('st-total').textContent  = all.length;
  document.getElementById('st-aprov').textContent  = aprovados.length;
  document.getElementById('st-reprov').textContent = refeitos.length;
  document.getElementById('st-falha').textContent  = falhas.length;

  // Gallery items conforme aba
  filteredItems = currentTab === 'ok'   ? aprovados
                : currentTab === 'err'  ? refeitos
                :                         falhas;
  renderGallery();
}

function renderGallery() {
  const gallery = document.getElementById('gallery');
  const emptyLabels = {
    ok:   { icon:'✅', txt:'Nenhum aprovado neste período.' },
    err:  { icon:'🔄', txt:'Nenhum pedido refeito neste período.' },
    warn: { icon:'⚠️', txt:'Nenhuma saída com falha neste período.' },
  };
  if (!filteredItems.length) {
    const e = emptyLabels[currentTab] || emptyLabels.ok;
    gallery.innerHTML = `
      <div class="empty">
        <span class="empty-icon">${e.icon}</span>
        <div class="empty-msg">${e.txt}</div>
      </div>`;
    return;
  }

  const statusLabel = {
    aprovado:     { txt:'Aprovado',       cls:'ok'   },
    refazer:      { txt:'Refazer Pedido', cls:'err'  },
    aceito_falha: { txt:'Aceito c/ Falha',cls:'warn' },
  };

  gallery.innerHTML = filteredItems.map((r, i) => {
    const pct   = Math.round(r.pct || 0);
    const cor   = pct >= 80 ? 'var(--gn)' : pct >= 50 ? 'var(--or)' : 'var(--rd)';
    const thumb = r.thumbSaida || r.photoSaida;
    const ts    = new Date(r.ts);
    const hora  = ts.toLocaleString('pt-BR', {day:'2-digit', month:'2-digit',
                    hour:'2-digit', minute:'2-digit'});
    const miss  = (r.faltando || []).slice(0, 3);
    const st    = statusLabel[getStatus(r)] || statusLabel.aprovado;

    const imgHtml = thumb
      ? `<img class="card-thumb" src="data:${detectMime(thumb)};base64,${thumb}" alt="" loading="lazy">`
      : `<div class="card-no-photo">📷</div>`;

    return `
      <div class="photo-card" onclick="openModal(${i})">
        ${imgHtml}
        <div class="card-body">
          <div class="card-pct" style="color:${cor}">${pct}%</div>
          <div class="card-name">${r.prato || '—'}</div>
          <div class="card-meta">#${r.num} · ${hora}${r.mesa ? ' · '+r.mesa : ''}</div>
          <div class="card-meta">${r.user || ''}</div>
          <span class="card-status ${st.cls}">${st.txt}</span>
          ${miss.length ? `<div class="card-miss">${miss.map(m=>`<span class="miss-tag">${m}</span>`).join('')}</div>` : ''}
        </div>
      </div>`;
  }).join('');
}

// Detecta tipo da imagem pelo base64
function detectMime(b64) {
  if (!b64) return 'image/jpeg';
  const h = b64.substring(0,12);
  if (h.startsWith('iVBORw0K')) return 'image/png';
  if (h.startsWith('/9j/'))    return 'image/jpeg';
  return 'image/jpeg';
}

// ── Lightbox ──────────────────────────────────────────────────────────────────
function openModal(idx) {
  modalIdx = idx;
  fillModal();
  document.getElementById('modal').classList.add('show');
}

function fillModal() {
  const r     = filteredItems[modalIdx];
  if (!r) return;
  const pct   = Math.round(r.pct || 0);
  const cor   = pct >= 80 ? 'var(--gn)' : pct >= 50 ? 'var(--or)' : 'var(--rd)';
  const ts    = new Date(r.ts).toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'});

  // Photos (saida + ref)
  const thumbS = r.thumbSaida || r.photoSaida;
  const thumbR = r.thumbRef   || r.photoRef;
  let imgsHtml = '';
  if (thumbS) imgsHtml += `<div style="flex:1;text-align:center">
    <img class="modal-img" src="data:image/jpeg;base64,${thumbS}" alt="Prato saído">
    <div class="modal-cap">Prato saído</div></div>`;
  if (thumbR) imgsHtml += `<div style="flex:1;text-align:center">
    <img class="modal-img" src="data:image/jpeg;base64,${thumbR}" alt="Referência">
    <div class="modal-cap">Referência</div></div>`;
  if (!thumbS && !thumbR) imgsHtml = `<div style="font-size:48px;color:var(--sb)">📷</div>`;
  document.getElementById('modal-imgs').innerHTML = imgsHtml;

  document.getElementById('modal-pct').textContent = pct + '%';
  document.getElementById('modal-pct').style.color = cor;
  document.getElementById('modal-name').textContent = r.prato || '—';
  document.getElementById('modal-detail').innerHTML =
    `Pedido #${r.num} · ${ts}` +
    (r.mesa ? ` · ${r.mesa}` : '') +
    (r.user ? ` · ${r.user}` : '') +
    (r.resumo ? `<br><span style="color:var(--tx)">${r.resumo}</span>` : '');

  const miss = r.faltando || [];
  document.getElementById('modal-miss').innerHTML = miss.length
    ? miss.map(m => `<span class="modal-miss-tag">❌ ${m}</span>`).join('')
    : '';

  document.getElementById('btn-prev').disabled = modalIdx <= 0;
  document.getElementById('btn-next').disabled = modalIdx >= filteredItems.length - 1;
}

function navModal(dir) {
  modalIdx = Math.max(0, Math.min(filteredItems.length - 1, modalIdx + dir));
  fillModal();
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

document.addEventListener('keydown', e => {
  if (!document.getElementById('modal').classList.contains('show')) return;
  if (e.key === 'Escape')      closeModal();
  if (e.key === 'ArrowLeft')   navModal(-1);
  if (e.key === 'ArrowRight')  navModal(+1);
});

// ── Cortex status ─────────────────────────────────────────────────────────────
fetch('/api/status').then(r=>r.json()).then(d=>{
  const dot = document.getElementById('cortex-dot');
  if (d.key_configured) {
    dot.style.background = 'var(--gn)';
    dot.style.boxShadow  = '0 0 6px var(--gn)';
  }
}).catch(()=>{});

// ── Neural background ─────────────────────────────────────────────────────────
(function(){
  const cv=document.getElementById('neuralBg'); if(!cv) return;
  const cx=cv.getContext('2d');
  let W,H,nd=[],cn=[],tm=0;
  function resize(){
    W=cv.width=window.innerWidth; H=cv.height=window.innerHeight;
    nd=Array.from({length:40},()=>({
      x:Math.random()*W, y:Math.random()*H,
      vx:(Math.random()-.5)*.18, vy:(Math.random()-.5)*.14,
      w:Math.random()<.45
    }));
  }
  window.addEventListener('resize',resize); resize();
  function spawn(){
    const a=Math.floor(Math.random()*nd.length);
    const b=(a+1+Math.floor(Math.random()*(nd.length-1)))%nd.length;
    const dx=nd[b].x-nd[a].x, dy=nd[b].y-nd[a].y, d=Math.sqrt(dx*dx+dy*dy);
    if(d<80||d>340) return;
    cn.push({a,b,p:0,s:.005+Math.random()*.009,w:nd[a].w,al:.07+Math.random()*.08});
    if(cn.length>20) cn.shift();
  }
  function tick(){
    cx.clearRect(0,0,W,H);
    nd.forEach(n=>{
      n.x+=n.vx; n.y+=n.vy;
      if(n.x<0||n.x>W)n.vx*=-1; if(n.y<0||n.y>H)n.vy*=-1;
      cx.beginPath(); cx.arc(n.x,n.y,.8,0,Math.PI*2);
      cx.fillStyle='rgba(160,185,255,0.04)'; cx.fill();
    });
    if(++tm>=30){spawn();tm=0;}
    const dead=[];
    cn.forEach((c,i)=>{
      const na=nd[c.a],nb=nd[c.b];
      c.p=Math.min(c.p+c.s,1);
      const px=na.x+(nb.x-na.x)*c.p, py=na.y+(nb.y-na.y)*c.p;
      cx.beginPath(); cx.moveTo(na.x,na.y); cx.lineTo(nb.x,nb.y);
      cx.strokeStyle=c.w?`rgba(0,212,255,${c.al})`:`rgba(43,143,255,${c.al})`;
      cx.lineWidth=.4; cx.stroke();
      cx.beginPath(); cx.arc(px,py,1.8,0,Math.PI*2);
      const g=cx.createRadialGradient(px,py,0,px,py,5);
      g.addColorStop(0,c.w?'rgba(0,212,255,.9)':'rgba(43,143,255,.9)');
      g.addColorStop(1,'rgba(0,0,0,0)');
      cx.fillStyle=g; cx.fill();
      if(c.p>=1) dead.push(i);
    });
    dead.reverse().forEach(i=>cn.splice(i,1));
    requestAnimationFrame(tick);
  }
  tick();
})();

// ── Init ──────────────────────────────────────────────────────────────────────
renderTrend();
render();
</script>
</body>
